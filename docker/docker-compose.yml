version: '3.8'

services:
  # Streamlit Dashboard
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shrimp-farming-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
      - ../logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

